<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTC Engineer Coach - 30 Days</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <h1>KTC Mastery <span class="badge">30J</span></h1>
      <div id="global-progress" class="progress-pill">0%</div>
    </div>

    <!-- Contrôles du Shift 3/3/3 et du Jour -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="day-select">Jour du défi :</label>
        <select id="day-select"></select>
      </div>

      <div class="control-group">
        <label for="shift-select">Shift actuel :</label>
        <select id="shift-select">
          <option value="day">☀️ Day Shift (5h-19h)</option>
          <option value="night">🌙 Night Shift (17h-7h)</option>
          <option value="rest">🔋 Rest Shift (Repos)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Bandeau Détente & Journaling rapide -->
    <section class="wellness-bar">
      <div class="wellness-card">
        <span>🧘‍♂️ Temps Détente / Scroll</span>
        <button id="btn-chill" class="btn-small">Activer 20 min</button>
      </div>
    </section>

    <!-- Grille des 10 Piliers -->
    <section id="pillars-grid" class="pillars-grid">
      <!-- Généré automatiquement par app.js -->
    </section>
  </main>

  <!-- Fenêtre Modale (Détail d'un Pilier) -->
  <div id="pillar-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Titre du Pilier</h2>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      
      <div class="shift-alert" id="modal-shift-advice">
        Adaptation au shift...
      </div>

      <div class="modal-body" id="modal-body">
        <!-- Contenu du jour -->
      </div>

      <!-- Zone de liens dédiée (à remplir/vérifier ensemble) -->
      <div id="modal-links" class="links-container"></div>

      <!-- Zone Journaling (visible surtout pour le Pilier 10 ou notes rapides) -->
      <div id="journal-box" class="journal-box hidden">
        <label for="journal-input">Note du jour (Victoire / Apprentissage / Ajustement) :</label>
        <textarea id="journal-input" rows="4" placeholder="Écris ton bilan ici..."></textarea>
      </div>

      <div class="modal-footer">
        <button id="btn-complete" class="btn-primary">✅ Marquer comme fait aujourd'hui</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
